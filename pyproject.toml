[project]
name = "agentic-coding-workflow"
version = "0.0.0"
description = "Development environment for the Agentic Coding Workflow plugin"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.15,<0.16",
]

[tool.uv]
package = false
required-version = "==0.11.26"
cache-dir = ".cache/uv"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
